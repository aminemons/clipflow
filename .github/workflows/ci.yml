name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            desktop/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Update system packages
        run: sudo apt-get update
      - name: Install media packages
        run: sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Python packages
        run: pip install -r backend/requirements.txt -r desktop/requirements.txt pytest
      - name: Check Python imports
        run: python -m compileall backend desktop launch.py
      - name: Check Azure update script
        run: bash -n deploy/azure/update-source.sh
      - name: Run Python tests
        run: python -m pytest backend/tests desktop/tests tests -q
      - name: Install frontend packages
        run: npm ci
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Run frontend tests
        run: npm test
        working-directory: frontend
